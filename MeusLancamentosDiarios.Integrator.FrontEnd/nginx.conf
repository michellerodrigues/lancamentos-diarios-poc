server {
    listen 80;
    root /usr/share/nginx/html;

    # SPA: qualquer rota que nao seja arquivo cai no index.html e o router do
    # Angular resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O service worker decide se ha versao nova lendo estes dois. Em cache, o
    # navegador ficaria preso na versao antiga depois de um novo build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache";
    }
}
